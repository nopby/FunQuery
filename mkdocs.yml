site_name: FunQuery
site_description: FunQuery query language documentation
docs_dir: docs

theme:
  name: material
  language: en
  features:
    - navigation.sections
    - navigation.expand
    - navigation.instant
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - scheme: default
      primary: teal
      accent: purple
      toggle:
        icon: material/toggle-switch-off-outline
        name: Switch to dark mode
    - scheme: slate
      primary: teal
      accent: lime
      toggle:
        icon: material/toggle-switch
        name: Switch to light mode

nav:
  - Home: index.md
  - Language:
      - Data Types: DataTypes.md
      - Operators: Operators.md
      - Functions: Functions.md
      - Variables: Variables.md
      - Field Access: FieldAccess.md
  - HTTP API: HttpApi.md
  - OpenAPI & Docs UI: OpenApi.md
  - Providers:
      - Overview: Providers.md
      - PostgreSQL: PostgreSql.md
      - Sources: Sources.md
  - Development:
      - Local Development: Development.md
      - Self-hosting Docs: SelfHosting.md
  - Roadmap:
      - Milestones: Milestones.md
      - Milestone 5: Milestone5.md
      - Milestone 6: Milestone6.md
      - Milestone 7: Milestone7.md

markdown_extensions:
  - admonition
  - attr_list
  - footnotes
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.mark
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
